name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # go.mod declares 1.20; build with a patched toolchain that still honours it.
          go-version: "1.22"
          cache-dependency-path: backend/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...

  strategy-engine:
    name: Python strategy engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/strategy-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/strategy-engine/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  strategy-graph:
    name: Python strategy graph
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/strategy-graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/strategy-graph/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q

  newclient:
    name: Newclient frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: newclient
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: newclient/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: node --test $(find src -name '*.test.mjs')
      - name: Build
        run: npm run build

  admin:
    name: Admin frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install
        run: npm ci
      - name: Test
        run: node --test $(find src -name '*.test.js')
      - name: Build
        run: npm run build
